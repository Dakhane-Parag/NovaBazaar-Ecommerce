services:
  # ============================================
  # Infrastructure
  # ============================================

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  mongodb:
    image: mongo:7
    container_name: ecommerce-mongodb
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: ecommerce-kafka
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwMTJEMkM2QkQ0OUJCMkY3RjI0MTc3QzI
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ecommerce-network

  elasticsearch:
    image: elastic/elasticsearch:8.15.0
    container_name: ecommerce-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ecommerce-network

  # ============================================
  # Backend Services
  # ============================================

  api-gateway:
    build:
      context: ./services/api-gateway
      args:
        SERVICE_NAME: api-gateway
    container_name: ecommerce-api-gateway
    environment:
      SERVICE_NAME: api-gateway
      PORT: "8100"
      PRODUCT_SERVICE_URL: http://ecommerce-product-service:8502
      SEARCH_SERVICE_URL: http://ecommerce-search-service:8103
      CORS_ORIGINS: http://localhost:5173
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      REQUEST_TIMEOUT: "10"
    ports:
      - "${API_GATEWAY_PORT:-8100}:8100"
    networks:
      - ecommerce-network

  user-service:
    build:
      context: ./services/user-service
      args:
        SERVICE_NAME: user-service
    container_name: ecommerce-user-service
    environment:
      SERVICE_NAME: user-service
      PORT: "8101"
    ports:
      - "${USER_SERVICE_PORT:-8101}:8101"
    networks:
      - ecommerce-network

  product-service:
    build:
      context: ./services/product-service
      args:
        SERVICE_NAME: product-service
    container_name: ecommerce-product-service
    environment:
      SERVICE_NAME: product-service
      PORT: "8502"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: product_db
    ports:
      - "${PRODUCT_SERVICE_PORT:-8502}:8502"
    depends_on:
      - mongodb
    networks:
      - ecommerce-network

  search-service:
    build:
      context: ./services/search-service
      args:
        SERVICE_NAME: search-service
    container_name: ecommerce-search-service
    environment:
      SERVICE_NAME: search-service
      PORT: "8103"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: products
    ports:
      - "${SEARCH_SERVICE_PORT:-8103}:8103"
    depends_on:
      - elasticsearch
    networks:
      - ecommerce-network

  search-indexer:
    build:
      context: ./workers/search-indexer
      args:
        SERVICE_NAME: search-indexer
    container_name: ecommerce-search-indexer
    environment:
      SERVICE_NAME: search-indexer
      PORT: "8109"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: products
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PRODUCT_TOPIC: product-events
      KAFKA_GROUP_ID: search-indexer
    depends_on:
      - elasticsearch
      - kafka
    networks:
      - ecommerce-network

  cart-service:
    build:
      context: ./services/cart-service
      args:
        SERVICE_NAME: cart-service
    container_name: ecommerce-cart-service
    environment:
      SERVICE_NAME: cart-service
      PORT: "8104"
    ports:
      - "${CART_SERVICE_PORT:-8104}:8104"
    networks:
      - ecommerce-network

  inventory-service:
    build:
      context: ./services/inventory-service
      args:
        SERVICE_NAME: inventory-service
    container_name: ecommerce-inventory-service
    environment:
      SERVICE_NAME: inventory-service
      PORT: "8105"
    ports:
      - "${INVENTORY_SERVICE_PORT:-8105}:8105"
    networks:
      - ecommerce-network

  order-service:
    build:
      context: ./services/order-service
      args:
        SERVICE_NAME: order-service
    container_name: ecommerce-order-service
    environment:
      SERVICE_NAME: order-service
      PORT: "8106"
    ports:
      - "${ORDER_SERVICE_PORT:-8106}:8106"
    networks:
      - ecommerce-network

  payment-service:
    build:
      context: ./services/payment-service
      args:
        SERVICE_NAME: payment-service
    container_name: ecommerce-payment-service
    environment:
      SERVICE_NAME: payment-service
      PORT: "8107"
    ports:
      - "${PAYMENT_SERVICE_PORT:-8107}:8107"
    networks:
      - ecommerce-network

  notification-service:
    build:
      context: ./services/notification-service
      args:
        SERVICE_NAME: notification-service
    container_name: ecommerce-notification-service
    environment:
      SERVICE_NAME: notification-service
      PORT: "8108"
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8108}:8108"
    networks:
      - ecommerce-network

  # ============================================
  # Frontend
  # ============================================

  frontend:
    build:
      context: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - ecommerce-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  kafka_data:
  elasticsearch_data:

networks:
  ecommerce-network:
    driver: bridge
